<!-- YOUR SECTION GOES HERE - BETWEEN HEADER AND FOOTER -->
<section>
  <h1>Enquiry - Sponsor / Volunteer</h1>
  <form id="enquiryForm" onsubmit="validateEnquiry(event)" action="#" method="post">
    <label>Name:</label>
    <input type="text" id="enq-name" required minlength="3">
    
    <label>Email:</label>
    <input type="email" id="enq-email" required>
    
    <label>Phone (10 digits):</label>
    <input type="tel" id="enq-phone" pattern="[0-9]{10}" required>
    
    <label>Enquiry Type:</label>
    <select id="enq-type" required>
      <option value="">Select</option>
      <option value="sponsor">Become a Sponsor</option>
      <option value="volunteer">Volunteer</option>
      <option value="player">Join as Player</option>
      <option value="services">Club Services</option>
    </select>
    
    <label>Message:</label>
    <textarea id="enq-message" required minlength="10"></textarea>
    
    <p id="enq-error" style="color:red;"></p>
    <button type="submit" class="btn">Submit Enquiry</button>
  </form>
  <div id="map" style="height:300px; margin-top:20px;"></div>
</section>
