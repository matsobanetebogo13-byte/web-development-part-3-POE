<!-- YOUR CONTACT FORM GOES HERE -->
<section>
  <h1>Contact Us</h1>
  <form id="contactForm" onsubmit="validateContact(event)" action="mailto:info@vosloorusunited.co.za" method="post" enctype="text/plain">
    <label>Name:</label>
    <input type="text" id="cont-name" required>
    
    <label>Email:</label>
    <input type="email" id="cont-email" required>
    
    <label>Message Type:</label>
    <select id="cont-type" required>
      <option value="general">General Enquiry</option>
      <option value="complaint">Complaint</option>
      <option value="feedback">Feedback</option>
    </select>
    
    <label>Your Message:</label>
    <textarea id="cont-message" required minlength="15"></textarea>
    
    <p id="cont-error" style="color:red;"></p>
    <button type="submit" class="btn">Send Message</button>
  </form>
</section>
